{% extends "base.html" %}
{% set auth_page = true %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<h1 class="auth-title">Welcome back</h1>
<p class="auth-subtitle">Log in to Nudge.</p>

<form method="post" action="{{ url_for('login') }}">
  <input class="input" type="email" name="email" placeholder="Email" required autofocus>
  <input class="input" type="password" name="password" placeholder="Password" required>
  <input class="submit" type="submit" value="Login">
</form>

<div class="auth-links">
  <a href="{{ url_for('reset_password') }}">Forgot password?</a>
  <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>
{% endblock %}
