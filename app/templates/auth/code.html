{% extends "base.html" %}
{% set auth_page = true %}
{% block title %}Enter code{% endblock %}

{% block auth_content %}
<h1 class="auth-title">Enter your code</h1>
<p class="auth-subtitle">We sent a verification code to your email.</p>

<form method="post" action="{{ url_for('verify_code') }}">
  <input class="input code-input" type="text" maxlength="8" name="code" placeholder="Code" required autofocus autocomplete="one-time-code">
  <input class="submit" type="submit" value="Submit">
</form>

<div class="auth-links">
  <a href="{{ url_for('reset_password') }}">Didn't get a code? Try again</a>
  <p><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
</div>
{% endblock %}
