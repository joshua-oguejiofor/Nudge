{% extends "base.html" %}
{% set auth_page = true %}
{% block title %}Reset password{% endblock %}

{% block auth_content %}
<h1 class="auth-title">Reset password</h1>
<p class="auth-subtitle">Enter your email and we'll send you a verification code.</p>

<form method="post" action="{{ url_for('reset_password') }}">
  <input class="input" type="email" name="email" placeholder="Email" required autofocus>
  <input class="submit" type="submit" value="Verify">
</form>

<div class="auth-links">
  <a href="{{ url_for('login') }}">&larr; Back to login</a>
  <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>
{% endblock %}
