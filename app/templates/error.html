{% extends "base.html" %}
{% block title %}Error{% endblock %}

{% block content %}
<div class="container error-box">
  <h1>{{ error }}</h1>
  <p>{{ message }}</p>
  <p>
    {% if current_user.is_authenticated %}
      <a class="link-btn" href="{{ url_for('home') }}">Back to home</a>
    {% else %}
      <a class="link-btn" href="{{ url_for('login') }}">Back to login</a>
    {% endif %}
  </p>
</div>
{% endblock %}
