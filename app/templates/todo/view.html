{% extends "base.html" %}
{% block title %}View{% endblock %}

{% block content %}
<h1 id="txt">Information of "{{ lst.title }}"</h1>

<section class="list-section">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Priority</th>
          <th>Description</th>
          <th>Options</th>
          <th>Done</th>
        </tr>
      </thead>
      <tbody>
        <tr class="{% if lst.completed %}done{% endif %}">
          <td>{{ lst.title }}</td>
          <td>{{ lst.priority }}</td>
          <td>{{ lst.description }}</td>
          <td>
            <a class="row-link" href="{{ url_for('update', id=lst.id) }}">Update</a>
            <a class="row-link row-link-danger" href="{{ url_for('delete', id=lst.id) }}" onclick="return confirm('Delete this task?')">Delete</a>
          </td>
          <td>
            <form action="{{ url_for('toggle_todo', id=lst.id) }}" method="post">
              <input type="checkbox" onchange="this.form.submit()" {% if lst.completed %}checked{% endif %}>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="back-link"><a href="{{ url_for('home') }}">&larr; Back to home</a></p>
</section>
{% endblock %}
